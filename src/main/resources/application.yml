spring:
  application:
    name: safe-route
  config:
    import:
      # 프로젝트 폴더의 .env 파일을 설정으로 읽는다. 파일이 없어도 오류 없이 넘어간다.
      - optional:file:.env[.properties]
      # 경로 계산 가중치·기준값
      - classpath:route.yml
  datasource:
    # 값은 모두 .env에 있다 (지금은 로컬 MySQL, 나중에 학교 서버로 옮김)
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        # 여러 줄 INSERT를 한 번에 보내서 대량 적재를 빠르게
        rewriteBatchedStatements: true
  servlet:
    multipart:
      # 불편 신고 사진 (POST /api/reports): 한 장 5MB, 사진 3장 + 글 합쳐 16MB까지
      max-file-size: 5MB
      max-request-size: 16MB

# 인증키는 .env에만 넣고, 여기서는 이름으로만 가리킨다.
api-keys:
  data-go-kr: ${DATA_GO_KR_KEY:}
  safemap: ${SAFEMAP_KEY:}
  kakao-rest: ${KAKAO_REST_KEY:}
  safetydata-police: ${SAFETYDATA_POLICE_KEY:}
  safetydata-security-light: ${SAFETYDATA_SECURITYLIGHT_KEY:}
  safetydata-cold-shelter: ${SAFETYDATA_COLDSHELTER_KEY:}
  safetydata-streetlight: ${SAFETYDATA_STREETLIGHT_KEY:}
  odsay: ${ODSAY_API_KEY:}
  tmap: ${TMAP_APP_KEY:}
  gemini: ${GEMINI_API_KEY:}

# 길찾기 비서 (C 파트, POST /api/assistant). 제미나이 키(GEMINI_API_KEY)가 없으면 규칙만으로 답한다
assistant:
  # 모델은 .env의 GEMINI_MODEL로 바꿀 수 있다 (새 AI Studio 키는 3 이후 모델을 쓴다)
  gemini-model: ${GEMINI_MODEL:}
  timeout-ms: 10000
  report-near-m: 30
  # 비서 토큰 줄이기 R4: 지식 조각 전문 검색 점수가 이보다 낮으면 붙이지 않음 (A파트 찾기 시험 1등 점수 1.4~11)
  knowledge-min-score: 1.0

# 대중교통 길찾기 (FR-37, C 파트). ODsay 는 하루 부를 수 있는 수가 적어 서버가 직접 세고 넘으면 부르지 않는다.
# 서버 두 대가 따로 세므로 실제로는 최대 두 배까지 갈 수 있다. 같은 출발·도착은 30분 기억해서 다시 쓴다
transit:
  odsay-daily-limit: 30

# 상황 판단 기준값 (C 파트). 숫자만 바꾸면 코드를 고치지 않아도 기준이 바뀐다.
situation:
  # 기온(℃): 기상청 초단기실황의 기온(T1H)과 비교한다
  heat-celsius: 33     # 이 값 이상이면 폭염
  cold-celsius: -10    # 이 값 이하면 한파
  # 미세먼지(㎍/㎥): 에어코리아 값과 비교한다. '나쁨' 등급이 시작하는 값
  pm10-bad: 81         # 미세먼지(PM10) 나쁨: 81~150
  pm25-bad: 36         # 초미세먼지(PM2.5) 나쁨: 36~75

# 서버 상태 확인 (배포 스크립트 deploy/deploy.sh가 /actuator/health 가 UP인지 본다).
# 밖에는 health 하나만 열고, DB 같은 세부 내용은 보이지 않게 둔다
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# 보호자 위치 공유 (C 파트, /api/guardian/shares, 029 표). 보호자 링크 = public-url + /s/{공유 번호}
guardian:
  public-url: ${GUARDIAN_PUBLIC_URL:https://safe-route.java21.net}
