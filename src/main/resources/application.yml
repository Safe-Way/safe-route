spring:
  application:
    name: safe-route
  config:
    import:
      # 프로젝트 폴더의 .env 파일을 설정으로 읽는다. 파일이 없어도 오류 없이 넘어간다.
      - optional:file:.env[.properties]
      # 경로 계산 가중치·기준값
      - classpath:route.yml
  datasource:
    # 값은 모두 .env에 있다 (지금은 로컬 MySQL, 나중에 학교 서버로 옮김)
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        # 여러 줄 INSERT를 한 번에 보내서 대량 적재를 빠르게
        rewriteBatchedStatements: true
  flyway:
    # DB 변경 자동 적용 (2026-11-23). 로컬 .env가 학교 DB를 가리키므로 기본은 꺼 두고, 배포(deploy.yml)에서만 켠다.
    # 켜 두면 기능 브랜치를 로컬에서 띄우기만 해도 머지 전 변경이 학교 DB에 들어간다
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/flyway
    # 학교 DB는 001~036을 손으로 적용해 둔 상태: 기록 표가 없으면 "36까지 적용됨"으로 표시만 하고 37부터 적용
    baseline-on-migrate: true
    baseline-version: 36
    baseline-description: manual 001-036 (db/migration)
  servlet:
    multipart:
      # 불편 신고 사진 (POST /api/reports): 한 장 5MB, 사진 3장 + 글 합쳐 16MB까지
      max-file-size: 5MB
      max-request-size: 16MB

# 인증키는 .env에만 넣고, 여기서는 이름으로만 가리킨다.
api-keys:
  data-go-kr: ${DATA_GO_KR_KEY:}
  safemap: ${SAFEMAP_KEY:}
  kakao-rest: ${KAKAO_REST_KEY:}
  safetydata-police: ${SAFETYDATA_POLICE_KEY:}
  safetydata-security-light: ${SAFETYDATA_SECURITYLIGHT_KEY:}
  safetydata-cold-shelter: ${SAFETYDATA_COLDSHELTER_KEY:}
  safetydata-streetlight: ${SAFETYDATA_STREETLIGHT_KEY:}
  odsay: ${ODSAY_API_KEY:}
  tmap: ${TMAP_APP_KEY:}
  gemini: ${GEMINI_API_KEY:}

# 불편 신고 (C 파트). 같은 사람 신고를 한 명으로 세려고 앱 번호에 이 비밀값을 섞어 해시로 남긴다 (033 reporter_hash).
# 비어 있으면 해시를 안 남긴다(신고마다 다른 사람으로 셈). 값은 .env·GitHub Secrets 에만
report:
  hash-secret: ${REPORT_HASH_SECRET:}
  # 신고 사진 종류 판단 모델 폴더 (model.onnx + labels.json). 비우면 jar 안 models/report_photo/ 를 쓰고,
  # 거기도 없으면 판단 없이 신고만 받는다 (photo_label 은 NULL = 지금처럼 하루)
  photo-model-dir: ${REPORT_PHOTO_MODEL_DIR:}

# 길찾기 비서 (C 파트, POST /api/assistant). 제미나이 키(GEMINI_API_KEY)가 없으면 규칙만으로 답한다
assistant:
  # 모델은 .env의 GEMINI_MODEL로 바꿀 수 있다 (새 AI Studio 키는 3 이후 모델을 쓴다)
  gemini-model: ${GEMINI_MODEL:}
  timeout-ms: 10000
  # 답 하나에 쓰는 시간 한도 (2026-11-16, 앱 박민수 님과 합의). 앱이 10초에 끊으므로 그보다 먼저 답한다.
  # 제미나이 왕복·다시 묻기를 모두 합쳐 이 시간을 넘으면 기다리지 않고 규칙(RuleBrain)으로 답한다
  answer-budget-ms: ${ASSISTANT_ANSWER_BUDGET_MS:7000}
  report-near-m: 30
  # 비서 토큰 줄이기 R4: 지식 조각 전문 검색 점수가 이보다 낮으면 붙이지 않음 (A파트 찾기 시험 1등 점수 1.4~11)
  knowledge-min-score: 1.0

# 대중교통 길찾기 (FR-37, C 파트). ODsay 는 하루 부를 수 있는 수가 적어 서버가 직접 세고 넘으면 부르지 않는다.
# 서버 두 대가 따로 세므로 실제로는 최대 두 배까지 갈 수 있다. 같은 출발·도착은 30분 기억해서 다시 쓴다
transit:
  odsay-daily-limit: 30

# 상황 판단 기준값 (C 파트). 숫자만 바꾸면 코드를 고치지 않아도 기준이 바뀐다.
situation:
  # 기온(℃): 기상청 초단기실황의 기온(T1H)과 비교한다
  heat-celsius: 33     # 이 값 이상이면 폭염
  cold-celsius: -10    # 이 값 이하면 한파
  # 미세먼지(㎍/㎥): 에어코리아 값과 비교한다. '나쁨' 등급이 시작하는 값
  pm10-bad: 81         # 미세먼지(PM10) 나쁨: 81~150
  pm25-bad: 36         # 초미세먼지(PM2.5) 나쁨: 36~75

# 서버 상태 확인 (배포 스크립트 deploy/deploy.sh가 /actuator/health 가 UP인지 본다).
# 밖에는 health 하나만 열고, DB 같은 세부 내용은 보이지 않게 둔다
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# 보호자 위치 공유 (C 파트, /api/guardian/shares, 029 표). 보호자 링크 = public-url + /s/{공유 번호}
guardian:
  public-url: ${GUARDIAN_PUBLIC_URL:https://safe-route.java21.net}

# 앱 업데이트 안내 (C 파트, GET /api/app/version). 숫자는 앱 build.gradle.kts의 versionCode.
# 번호 = 앱 CI 실행 번호(앱 #180부터 versionCode). 176 = #180 머지 빌드(e3c04ac). 새 APK를 내면 latest를 올리고, 옛 앱을 꼭 바꾸게 하려면 min도 올린다. download-url이 비면 창이 안 뜬다.
app-update:
  latest-version-code: ${APP_LATEST_VERSION_CODE:176}
  latest-version-name: ${APP_LATEST_VERSION_NAME:1.0}
  min-version-code: ${APP_MIN_VERSION_CODE:1}
  message: ${APP_UPDATE_MESSAGE:새 버전이 나왔어요. 업데이트하고 더 안전한 길을 안내받으세요.}
  download-url: ${APP_DOWNLOAD_URL:}

# 게스트 본인 확인 (2026-11-23, 공개 배포 준비 1-1, com.saferoute.guest.GuestAuthFilter).
# 앱이 X-Guest-Id·X-Guest-Token 헤더를 보내면 그 번호로 처음 온 토큰을 등록하고 다음부터 같은지 본다(guest_token 037).
# false 인 동안은 토큰 없는 요청도 받는다. 앱이 토큰을 보내는 버전으로 바뀐 뒤 true로 바꾼다. 틀린 토큰은 언제나 막는다.
guest-auth:
  enforce: ${GUEST_AUTH_ENFORCE:false}

# /api 요청 수 제한 (공개 배포 준비 1-2, com.saferoute.guest.RateLimitFilter). 서버 한 대 안에서 센다.
# 게스트 번호(없으면 IP)마다 세고, 번호를 바꿔 가며 부르는 것을 막으려고 IP마다 넉넉한 상한을 따로 둔다.
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  per-minute: 120              # /api 전체, 게스트마다
  ip-per-minute: 600           # /api 전체, IP마다 (통신사 NAT로 여러 사람이 한 IP일 수 있어 넉넉히)
  assistant-per-minute: 20     # POST /api/assistant (제미나이 비용)
  assistant-per-day: 300
  assistant-ip-per-minute: 60
  reports-per-hour: 10         # POST /api/reports (사진 3장·16MB까지)
  reports-ip-per-hour: 30
