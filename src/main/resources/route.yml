# 경로 계산 설정. 값을 바꾸면 서버를 다시 켜야 적용된다.
# 빌드 없이 한 번만 바꿔 보려면 실행 인자로 덮어쓴다: --route.profiles.child.day.help-m=140
# 기준과 근거는 결정 문서 「경로 엔진 결정 사항 정리」(2026-11-02·03 확정)에 있다.
#
# 길 비용 = 길이 + λ × 추가 비용
#   추가 비용 = 길이 × Σ 비중 × (그 길 중 기준 범위 밖 비율)
#   λ(0~1)는 안전 경로가 우회 한도(max-detour)를 넘지 않는 가장 큰 값을 요청마다 찾는다.
#   범위 밖 비율(커버율)은 서버가 요청 때 시설 표(poi)로 계산한다. DB(edge_stat)에는 원값만 있다.
#
# 기준 이름 (weights)
#   light   가로등·보안등에서 길을 따라 30m 안
#   cctv    CCTV에서 길을 따라 50m 안 (교통·쓰레기·시설·재난 단속용은 뺌, 결정 39)
#   help    지금 이용 가능한 도움 시설에서 반경 help-m 안
#           낮: 경찰·편의점·비상벨·아동안전지킴이집 / 밤: 지킴이집·건물 안 비상벨을 뺌 (24시간 경찰·길가 비상벨·편의점)
#   school  어린이보호구역 대상 시설에서 반경 school-m 안
#   rest    지금 이용 가능한 쉼터·공중화장실에서 반경 rest-m 안
#   alley   골목길이 아닌 길 (시설이 아니라 길 성질이라 0 또는 1, 2026-11-12 카카오맵 현장 비교). 휠체어·노인·어린이가 쓴다 (어른은 안 씀)
#           골목길 = 골목급 차도(service·residential·unclassified·living_street)인데 인도 태그가 없거나 no.
#           인도 없는 골목은 차와 사람이 같이 써서 아무 데서나 차도를 건너게 된다. 보도·횡단보도 길, 인도 태그(left·right·both) 있는 길은 아님.
#           응답 routes[].alleys·alleyM은 모든 모드에 주고, 설명 문장("큰 길로 가서 골목길을 ○m 줄여요", 알림 "골목길 약 ○m를 지납니다")은 이 기준을 쓸 때만
# 이용 가능: 운영 기간·시간·공휴일로 판단. 편의점은 시간 정보가 없어도 연 것으로 보고, 그 밖의 "확인 안 됨"은 세지 않는다.
# 시간 정보가 없는 쉼터는 운영 기간 안이면 평일 09~18시에 연 것으로 본다.
# 모르는 값(보도턱·신호 등)은 감점하지 않고 "확인 안 됨"으로만 알린다.

route:
  # 도로망을 어디서 읽을지. mysql: DB의 road_node·road_edge·edge_stat (A파트 적재, 문화전당 반경 2km)
  # none: 도로망 없음(모든 요청 OUT_OF_AREA). DB 없이 서버만 띄울 때 실행 인자로 --route.road-source=none
  road-source: mysql

  # 조명·CCTV 커버율 ("길 따라": 시설을 가장 가까운 길 하나에 붙이고, 그곳에서 길을 따라 퍼진다)
  coverage:
    light-m: 30          # 등이 비추는 범위
    cctv-m: 50           # CCTV가 찍는 범위
    snap-to-road-m: 20   # 이보다 길에서 멀면 길을 비추거나 찍지 않는다고 본다
    sample-m: 10         # 길을 이 간격으로 나눠 잰다

  # 누가 걷는지에 따라 바뀌는 기준. 요청의 mode로 고른다. 없으면 adult
  # mode 이름은 adult·child·senior·wheelchair로 통일한다 (2026-11-03 결정. 앱·요구사항 문서도 이 이름으로 맞춘다)
  #   max-detour     안전 경로가 최단 경로의 몇 배까지 돌 수 있는지. 0이면 한도 없음
  #   night-lead-min 일몰 몇 분 전부터 밤으로 볼지
  #   exclude        이 성질이 확인된 길은 아예 뺀다 (stairs 경사로가 확인되지 않은 계단, curb 확인된 턱, footbridge 못 지나는 육교, trail 등산로, ford 징검다리)
  #   등산로(trail, 등산 난이도 sac_scale이 붙은 산길·계단): exclude에 없는 모드(어른·어린이·노인)도 등산로 없는 길이 있으면 몇 배를 돌아도 그 길로 간다.
  #                  없을 때만 등산로로 가고 알린다. 요청 allowTrail = true면 피하지 않는다 (2026-11-12, 코드에 있음: RouteService)
  #   avoid-stairs   계단 조건부 제외: 계단 없는 길이 우회 한도 안에 있으면 계단 길을 뺀다
  #   avoid-unpaved  비포장 조건부 제외: 비포장 없는 길이 우회 한도 안에 있으면 비포장 길을 뺀다
  #   avoid-events   둘레를 조건부로 피할 행사·돌발 종류 (road_event.kind). 계단·비포장 피하기 다음으로 지킨다.
  #                  목록에 없는 종류는 지날 때 알리기만 한다 (아래 events)
  #   day / night    그때의 기준. weights가 비면 가장 짧은 길
  #                  비 오는 날은 아래 rain에 따라 지붕 없는 길의 부담을 곱한다 (2026-11-09)
  #   *-m            반경은 "걸어서 약 2분" (어린이 분당 70m, 노인 60m, 어른 80m). 보호구역은 법 기준 300m
  #   note           다른 길을 골랐는데 말할 실제 차이(시설 +○곳, 계단·비포장 피함)가 없을 때 보여 줄 문장.
  #                  보통은 기준 시설의 실제 차이로 말한다 (2026-11-06)
  profiles:
    adult:                 # 청년·중년
      max-detour: 1.3
      walk-speed-m-per-min: 80
      night-lead-min: 0
      avoid-events: [통제, 사고, 재난, 공사]      # 행사는 알리기만 (붐벼도 걸을 수 있음)
      night:
        weights: { light: 5, help: 2, cctv: 1 }   # 밝기 > 도움 시설 > CCTV. 9:3:1에서 바꿈 (2026-11-04, 밝기 같고 덜 돎)
        help-m: 160
    child:                 # 어린이·청소년
      max-detour: 1.3
      walk-speed-m-per-min: 70
      night-lead-min: 60
      avoid-events: [통제, 사고, 재난, 공사, 행사]   # 붐비는 곳에서 보호자를 놓치지 않게 행사도 피한다
      day:
        weights: { school: 3, help: 1, alley: 1 } # 보호구역 > 도움 시설 = 골목길 피하기. 골목 0.5~4 시험해 1 (2026-11-12, docs 2장)
        school-m: 300
        help-m: 150
        note: 어린이보호구역과 도움을 청할 곳이 가까운 길로 갑니다
      night:
        weights: { light: 5, help: 2, cctv: 1, alley: 0.5 }   # 밤에는 보호구역을 쓰지 않는다. 골목길은 CCTV 다음 (2026-11-12)
        help-m: 150
    senior:                # 노인
      max-detour: 1.2
      walk-speed-m-per-min: 60
      night-lead-min: 0
      avoid-stairs: true
      avoid-events: [통제, 사고, 재난, 공사, 행사]   # 붐비는 행사·좁아진 공사 길도 피한다
      day:
        weights: { rest: 4, alley: 2 }            # 지금 이용 가능한 쉼터·공중화장실 (어린이 낮 3+1과 같은 세기) > 골목길. 골목 0.5~4 시험해 2 (2026-11-12, docs 2장)
        rest-m: 120
        note: 쉴 곳이 가까운 길로 갑니다
      night:
        weights: { light: 5, help: 2, cctv: 1, alley: 0.5 }   # 공중화장실은 경로 계산에 넣지 않는다. 골목길은 CCTV 다음 (2026-11-12)
        help-m: 120
    wheelchair:            # 휠체어: 계단·확인된 턱·못 지나는 육교를 뺀 길 중에서 고른다
      max-detour: 1.2      # 지날 수 있는 길 중 최단의 1.2배까지 (2026-11-04 결정. 이동이 힘들어 노인과 같은 값)
      walk-speed-m-per-min: 50
      night-lead-min: 0
      exclude: [stairs, curb, footbridge, trail, ford, plaza]   # trail 등산로(allowTrail이어도 뺌), ford 징검다리 (2026-11-04)
      # plaza 보행자 광장 가로지르기 길(A파트가 입구끼리 그은 곧은 선): 높낮이를 몰라 계단을 건너뛰는 선이 있어 휠체어는 안 씀 (2026-11-10)
      avoid-unpaved: true  # 비포장 조건부 제외: 비포장 없는 길이 1.2배 안이면 그 길로, 아니면 비포장 길 + 알림 (2026-11-04)
      avoid-events: [통제, 사고, 재난, 공사, 행사]
      day:                 # 낮: 큰 길을 먼저(골목길 기준만). 비포장을 피해 다른 길을 고르면 그 이유를 note로 말한다
        weights: { alley: 0.5 }                   # 골목길(인도 없는 골목급 차도)을 피해 큰 길로, 1.2배 안에서만. 0.1~5 시험해 0.5 (2026-11-12, docs 2장)
        note: 비포장을 피하는 길로 갑니다
      night:
        weights: { light: 5, help: 2, cctv: 1, alley: 0.5 }   # 어두우면 턱·패인 곳이 안 보여 밝기를 먼저 (2026-11-04 결정). 골목길은 CCTV 다음 (2026-11-12)
        help-m: 120                               # 노인과 같은 120m

  # 경로에서 이 거리 안에 있는 시설을 "지나는 시설"로 센다 (설명 문장·지도 아이콘용, 결정 12)
  count-radius-m:
    light: 30        # 가로등·보안등
    cctv: 50
    bell: 50         # 비상벨
    help: 50         # 경찰·편의점·아동안전지킴이집
    rest: 120        # 지금 이용 가능한 쉼터·공중화장실 (노인 낮 rest-m과 같게, 2026-11-06)
    school: 300      # 어린이보호구역 대상 시설. 점은 시설 위치, 보호구역은 그 둘레 300m (어린이 낮 school-m과 같게)
  # 시설은 poi(출처 중복을 10m 안에서 이미 합친 표)에서 읽으므로 서버에서 다시 합치지 않는다
  # 지도에 보낼 시설 아이콘 최대 개수
  max-facilities: 300

  # 출발·도착을 감싼 사각형을 사방으로 넓혀 그 안의 길만 읽는다 (8.1)
  search-margin-m: 500
  # 그 범위에서 경로를 못 찾으면 이만큼 넓혀 한 번 더 찾는다. 강·철도·큰 도로를 다리·육교로 돌아가는 길 (2026-11-04)
  retry-margin-m: 1500
  # 출발·도착에서 가장 가까운 길까지 이보다 멀면 경로를 찾지 않는다
  snap-max-m: 300
  # 휠체어는 지날 수 있는 길(계단 등을 뺀 길)로 이어진 곳에 붙인다. 가장 가까운 길이 계단으로만 드나드는 구역이면
  # 옆 길에 붙이고 설명에 알린다. 모든 길 기준보다 이보다 더 멀어지면 붙이지 않는다 (2026-11-04)
  passable-snap-extra-m: 50
  # 휠체어 출발점만 이 값까지 붙인다. 건물 안에서 출발하면(유스퀘어: 가장 가까운 길은 계단 2m, 이어진 길은 84m) 50m로는 못 찾는다.
  # 이미 그 안에 있으면 휠체어로 들어온 길이 있다고 본다. 도착·들를 곳·등산로 피하기와 길안내 중 다시 찾기(reroute)는 50m (2026-11-13)
  passable-snap-origin-extra-m: 100
  # 출발·도착이 이보다 가까우면 SAME_POINT, 직선거리가 이보다 멀면 TOO_FAR (8.3)
  same-point-m: 50
  too-far-m: 5000

  # 밤 경로에서 걷는 동안 "앞으로 ○m는 조명이 적습니다" 안내에 쓸 어두운 구간 (FR-31, 2026-11-05).
  # 가로등 30m 밖 표본을 이어 구간을 만든다. 밝은 틈이 merge-gap-m 이하면 잇고, min-m보다 짧으면 버린다.
  # 경로당 안내 수를 운영 테스트로 보고 다시 정한다
  dark-stretch:
    merge-gap-m: 10
    min-m: 50

  # 걷는 동안 "80m 앞 왼쪽" 안내에 쓸 꺾는 곳 (FR-34, 2026-11-05).
  # 경로 선을 따라 앞뒤 look-m 구간으로 잰 방향이 min-angle보다 크게 바뀌면 꺾는 곳 (갈림길이 아닌 큰길 모퉁이도 포함).
  # 꺾는 곳은 빼지 않는다. 다음 꺾는 곳이 link-m 안에 이어지면 thenM을, 꺾은 뒤 횡단보도를 지나면 crossing을 붙여
  # 앱이 "오른쪽 횡단보도를 건너 왼쪽"처럼 한 번에 말하게 한다 (음성은 30m 앞에서 나와 따로 말하면 겹침)
  turn:
    min-angle: 45
    look-m: 15
    link-m: 20

  # 길 위의 행사·돌발상황 (A파트 road_event 표, 2026-11-06). 요청 시각에 진행 중인 것만 쓴다.
  # 영향 반경(행사 300m, 돌발 100m)에 걸치는 길을 모드별 avoid-events에 따라 조건부로 피하고 (우회 한도 안일 때만),
  # 피하지 않는 것은 지날 때 알린다. 응답 routes[].events에 경로를 따라 들어가고 나오는 거리(m)를 준다.
  events:
    # 이 말이 이름에 든 행사는 걷기에 오히려 좋아 어느 모드도 피하지 않는다 (띄어쓰기 무시)
    walk-friendly: [차 없는 거리, 보행자 천국, 보행자 전용]

  # 비 오는 날 (2026-11-09, w04). 밤처럼 새 단계를 두지 않고 그때의 낮·밤 기준에 지붕 기준을 곱한다 (비 오는 밤도 있으므로).
  #   지붕 있는 길 = road_edge.covered(OSM covered·indoor·tunnel)와 A파트가 그린 지하 길.
  #   walk-more   젖지 않으려고 더 걸을 수 있는 비율. 0.4 확정 (2026-11-09, 사용자 결정): 시연 길(지하 787m ÷ 비 올 때 지상 584m = 1.348배)이
  #               들어가는 가장 작은 값. 0.3이면 시연 길이 지상, 0.5는 일반 경로만 더 흔든다 (RainSensitivityCheck).
  #               여유가 0.052뿐이라 지하 데이터가 바뀌면 다시 확인한다.
  #               비가 오면 지붕 없는 길의 부담 전체(거리 + 그 모드 기준 부담)를 (1 + walk-more)배로 본다.
  #               지상 길끼리는 같은 배수라 순위가 맑은 날과 같고(기준이 묽어지지 않음), 지붕 아래 길만 상대적으로 가벼워진다.
  #               전부 지붕 아래인 길이 (1 + walk-more)배 길이까지면 지상 길과 비용이 같으므로,
  #               비 올 때 우회 한도도 max(모드 한도, 1 + walk-more)로 같은 값에서 나온다. 다만 넓힌 한도는 그 길이 지붕 아래를 실제로 더 걸을 때만
  #               쓴다: 비 때문에 더 걷는 것은 지붕 아래로 가기 위해서만이다 (넓힌 한도로 쉼 곳·밝은 길만 더 챙기면 노인 낮 평균 +104m 중 지붕 15m).
  #               사람이 직접 정한 우회 한도(user_profile)가 있으면 그 값이 우선이고 넓히지 않는다.
  #               더하기(지붕 비중 2)로 넣었을 때는 지상에서 거리 벌점처럼 작동해 노인 쉼 곳 기준이 묽어졌다 (61쌍 중 34쌍 바뀜, 평균 −45m)
  #   note        지붕 있는 길로 돌았는데 말할 차이가 없을 때 문장
  # 비 판단: 요청 rain(auto·on·off, night와 같은 모양). auto면 C파트 날씨(WeatherDustService, 기상청, 같은 동네 10분 기억). 모르면 비 아님
  rain:
    walk-more: 0.4
    note: 비가 와서 지붕 있는 길로 갑니다
  # 지하 길(road_edge_excluded reason = underground: 역 출구 계단·엘리베이터 → 대합실, 금남지하상가 통로)은 비 올 때 이 시간 안에만 도로망에 넣는다.
  # 광주 지하철 운행 시간(첫차 05:30, 막차 24:00께. A파트 확인 필요). 맑은 날은 넣지 않는다: 지하에서 GPS가 끊겨 걷는 안내가 깨진다 (A파트 요청)
  underground:
    open: "05:30"
    close: "24:00"
