# 서버 CI: PR과 develop/main 푸시마다 빌드하고 테스트한다.
# 학교 DB에는 GitHub 서버에서 접속할 수 없어서, 빈 MySQL 8.0을 잠깐 띄워 쓴다 (학교 서버와 같은 8.0).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 브랜치에 새로 푸시하면 앞의 검사는 멈춘다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 서버 빌드·테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: safe_route
          MYSQL_USER: safe_route
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # 앱은 .env가 없으면 이 환경변수를 읽는다 (CI 전용 값이라 비밀이 아님)
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/safe_route?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      DB_USERNAME: safe_route
      DB_PASSWORD: ci-only-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: DB 표 만들기 (schema.sql 문법 검사 겸)
        run: |
          mysql -h 127.0.0.1 -u safe_route -pci-only-password --default-character-set=utf8mb4 safe_route \
            < src/main/resources/db/schema.sql
          mysql -h 127.0.0.1 -u safe_route -pci-only-password safe_route -e "SHOW FULL TABLES"

      - name: 빌드·테스트
        run: ./mvnw -B -ntp verify

      - name: 실패한 테스트 결과 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7
