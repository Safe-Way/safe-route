# 서버 CI/CD: develop·main으로 오는 PR과 main 푸시마다 빌드하고 테스트한다 (CI).
# main에 푸시됐을 때(PR 머지 포함) 테스트가 통과하면 deploy.yml을 불러 학교 서버에 배포한다 (CD).
# develop은 새 기능 브랜치를 따고 합치는 곳이라 테스트만 돌린다. 배포하려면 develop → main PR을 머지한다 (2026-11-05 결정)
# develop 푸시(PR 머지)는 돌리지 않는다: 같은 변경을 PR에서 이미 시험했고, develop → main PR에서 다시 시험한다.
#   비공개 저장소 Actions 무료 시간(조직 합쳐 월 2,000분)을 11월에 넘겨서 줄임 (2026-11-23, PR+푸시 562번 중 develop 푸시가 약 절반)
# 학교 DB에는 GitHub 서버에서 접속할 수 없어서, 빈 MySQL 8.0을 잠깐 띄워 쓴다 (학교 서버와 같은 8.0).
name: CI/CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

# 같은 브랜치에 새로 푸시하면 앞의 검사는 멈춘다.
# main은 배포가 이어서 돌기 때문에 멈추지 않고, 앞의 실행(배포 포함)이 끝난 뒤 다음 것을 돌린다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # 배포 규칙 지키기 (결정 55): main으로 오는 PR은 develop에서만 받는다.
  # 기능 브랜치를 main으로 바로 보내면 테스트 서버(develop)를 거치지 않고 배포되고, develop과 main이 갈라진다.
  # 이 검사가 빨갛게 되면 PR 화면에서 base를 develop으로 바꾸면 된다.
  # (Settings > Branches에서 main의 필수 검사로 'main은 develop에서만'을 넣으면 머지 버튼도 막힌다)
  main-from-develop:
    name: main은 develop에서만
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: PR이 develop에서 왔는지 보기
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::main으로는 develop에서만 PR을 보내요(결정 55). 지금 PR은 '$HEAD_REF' → main 이에요. PR 화면 위쪽 base를 develop으로 바꿔 주세요."
            exit 1
          fi
          echo "develop → main 이라 괜찮아요"

  test:
    name: 서버 빌드·테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: safe_route
          MYSQL_USER: safe_route
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # 앱은 .env가 없으면 이 환경변수를 읽는다 (CI 전용 값이라 비밀이 아님)
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/safe_route?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      DB_USERNAME: safe_route
      DB_PASSWORD: ci-only-password
      # 테스트가 띄우는 앱도 Flyway를 켠다: 이미 적용된 DB라 확인만 하고 넘어간다 (V 파일이 바뀌었으면 여기서 잡힘)
      FLYWAY_ENABLED: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 배포와 같은 길로 표를 만든다: 앱을 띄우면 Flyway가 빈 DB에 db/flyway 의 V 파일을 차례로 적용 (2026-11-23)
      - name: DB 표 만들기 (Flyway)
        run: |
          ./mvnw -B -ntp -Dtest=SafeRouteApplicationTests -Dsurefire.failIfNoSpecifiedTests=false test
          mysql -h 127.0.0.1 -u safe_route -pci-only-password safe_route \
            -e "SELECT version, description, success FROM flyway_schema_history; SHOW FULL TABLES"

      # schema.sql(표 전체 그림·ERD 원본)이 V 파일과 어긋나지 않았는지. V 파일을 더하면 schema.sql도 같이 고친다
      - name: schema.sql이 Flyway 결과와 같은지
        run: |
          mysql -h 127.0.0.1 -u root -pci-only-root -e "CREATE DATABASE schema_check"
          mysql -h 127.0.0.1 -u root -pci-only-root --default-character-set=utf8mb4 schema_check \
            < src/main/resources/db/schema.sql
          MYSQL_PWD=ci-only-root scripts/check_schema_sync.sh 127.0.0.1 3306 root safe_route schema_check

      - name: 빌드·테스트
        run: ./mvnw -B -ntp verify

      - name: 실패한 테스트 결과 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

  # main 푸시에서 테스트가 통과했을 때만 배포한다. PR과 develop 푸시에서는 돌지 않는다
  deploy:
    name: 학교 서버 배포
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
