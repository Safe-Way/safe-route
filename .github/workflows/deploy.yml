# 학교 서버 배포.
# main에 푸시되면 CI(ci.yml)가 테스트를 돌리고, 통과하면 이 워크플로를 불러 배포한다.
# develop은 기능 브랜치를 따고 합치는 곳이라 배포하지 않는다. 배포하려면 develop → main PR을 머지한다.
# 도커 이미지를 만들어 ssh로 서버에 올리고 deploy/deploy.sh로 띄운다.
# (Actions 탭의 Run workflow 버튼은 이 파일이 기본 브랜치(main)에 들어간 뒤에 보인다)
#
# 필요한 Repository secrets (Settings > Secrets and variables > Actions). 값은 저장소에 올리지 않는다:
#   SSH_ADDRESS, SSH_PORT, SSH_ID, SSH_PASSWORD   서버 접속 정보
#   APP_PORT                                      받은 포트번호(8321). 학교 nginx가 이 포트로 넘겨준다
#   DB_ADDRESS, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD   학교 MySQL 접속 정보 (서버 안에서 닿는 주소)
#   KAKAO_REST_KEY                                장소 검색, 미세먼지용 시·도 찾기
#   DATA_GO_KR_KEY                                날씨(기상청), 미세먼지(에어코리아)
#   REPORT_HASH_SECRET                            (선택) 같은 사람 신고를 한 명으로 세는 해시 비밀값
#
# Repository variables (같은 화면의 Variables 탭, 비밀값이 아닌 설정):
#   APP_DOWNLOAD_URL                              (선택) 앱 업데이트 창 [업데이트] 버튼이 여는 주소. 비면 창이 안 뜬다
#
# 순서: (CI 테스트 통과) → secrets 확인 → 코드 받기 → jar 빌드 → 도커 이미지 빌드·압축 → 환경변수 파일 만들기
#       → 서버로 올리기(scp) → 서버에서 deploy.sh 실행(앱 두 대 한 대씩 교체)
name: Deploy

on:
  # ci.yml이 테스트가 통과한 뒤 부른다 (secrets: inherit 로 레포 secrets를 넘겨받는다)
  workflow_call:
  # Actions 탭에서 손으로 돌리기
  workflow_dispatch:

# 이 워크플로가 GitHub에 할 수 있는 일: 코드 읽기만
permissions:
  contents: read

jobs:
  deploy:
    name: 학교 서버 배포
    runs-on: ubuntu-latest
    # 배포는 한 번에 하나씩. 돌고 있는 배포는 끊지 않고 다음 배포가 기다린다
    concurrency:
      group: deploy
      cancel-in-progress: false
    timeout-minutes: 30
    # secrets를 환경변수로 꺼내 둔다. 로그에는 *** 로 가려져 찍힌다
    env:
      SSH_ADDRESS: ${{ secrets.SSH_ADDRESS }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_ID: ${{ secrets.SSH_ID }}
      SSHPASS: ${{ secrets.SSH_PASSWORD }}   # sshpass -e가 이 이름의 환경변수에서 비밀번호를 읽는다
      APP_PORT: ${{ secrets.APP_PORT }}
      DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      ODSAY_API_KEY: ${{ secrets.ODSAY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REPORT_HASH_SECRET: ${{ secrets.REPORT_HASH_SECRET }}
      # 공개 배포 준비 (2026-11-23): 저장소 Variables(비밀 아님)로 켜고 끔. 비어 있으면 아래 기본값
      GUEST_AUTH_ENFORCE: ${{ vars.GUEST_AUTH_ENFORCE }}
      RATE_LIMIT_ENABLED: ${{ vars.RATE_LIMIT_ENABLED }}
      APP_DOWNLOAD_URL: ${{ vars.APP_DOWNLOAD_URL }}
    steps:
      # 꼭 필요한 secret이 하나라도 비어 있으면 이름을 알려 주고 멈춘다(서버에 반쯤 올라가는 것을 막는다)
      - name: secrets 확인
        run: |
          missing=""
          for name in SSH_ADDRESS SSH_PORT SSH_ID SSHPASS APP_PORT DB_ADDRESS DB_PORT DB_NAME \
                      DB_USERNAME DB_PASSWORD KAKAO_REST_KEY DATA_GO_KR_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing ${name/SSHPASS/SSH_PASSWORD}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Repository secrets가 비어 있어요:$missing"
            exit 1
          fi

      # CI가 테스트한 바로 그 커밋을 배포한다
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 테스트는 CI가 이미 돌렸다
      - name: jar 빌드
        run: ./mvnw -B -ntp -DskipTests package

      # Dockerfile로 이미지를 만들고 파일 하나(image.tar.gz)로 묶는다. 태그는 커밋 앞 12자리
      - name: 도커 이미지 빌드
        run: |
          tag="safe-route:${GITHUB_SHA::12}"
          docker build -t "$tag" .
          docker save "$tag" | gzip > "$RUNNER_TEMP/image.tar.gz"
          ls -lh "$RUNNER_TEMP/image.tar.gz"

      # 서버의 앱이 읽을 환경변수 파일(app.env)을 만든다. KEY=값 한 줄씩.
      # umask 077: 이 파일을 runner 계정만 읽게. 값에 줄바꿈이 있으면 파일이 깨지므로 멈춘다
      - name: 환경변수 파일 만들기
        run: |
          umask 077
          f="$RUNNER_TEMP/app.env"
          : > "$f"
          put() {
            case "$2" in *$'\n'*) echo "::error::$1 값에 줄바꿈이 있어요"; exit 1;; esac
            printf '%s=%s\n' "$1" "$2" >> "$f"
          }
          put DB_URL "jdbc:mysql://${DB_ADDRESS}:${DB_PORT}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
          put DB_USERNAME "$DB_USERNAME"
          put DB_PASSWORD "$DB_PASSWORD"
          put KAKAO_REST_KEY "$KAKAO_REST_KEY"
          put DATA_GO_KR_KEY "$DATA_GO_KR_KEY"
          put ODSAY_API_KEY "$ODSAY_API_KEY"
          put GEMINI_API_KEY "$GEMINI_API_KEY"
          # 신고한 사람 해시용 비밀값 (비어 있으면 앱은 그대로 돌고 reporter_hash 만 비어 있음)
          put REPORT_HASH_SECRET "$REPORT_HASH_SECRET"
          # 게스트 본인 확인(앱이 토큰을 보내기 전까지 false)·요청 제한. 저장소 Variables 에서 바꿈
          put GUEST_AUTH_ENFORCE "${GUEST_AUTH_ENFORCE:-false}"
          put RATE_LIMIT_ENABLED "${RATE_LIMIT_ENABLED:-true}"
          # 앱 업데이트 창의 내려받을 주소 (GET /api/app/version의 downloadUrl). 비어 있으면 업데이트 창이 뜨지 않는다
          put APP_DOWNLOAD_URL "$APP_DOWNLOAD_URL"
          # 서버 코드가 쓰지 않는 키(데이터 적재 스크립트용). application.yml이 이름을 가리키고 있어 빈 값으로 둔다
          for name in SAFEMAP_KEY SAFETYDATA_POLICE_KEY SAFETYDATA_SECURITYLIGHT_KEY SAFETYDATA_COLDSHELTER_KEY \
                      SAFETYDATA_STREETLIGHT_KEY TMAP_APP_KEY; do
            put "$name" ""
          done

      # 서버에 ~/safe-route 폴더를 만들고 이미지·환경변수·deploy.sh를 올린다.
      # 서버가 비밀번호 로그인이라 sshpass를 쓴다. StrictHostKeyChecking=accept-new: 처음 보는 서버 키는 받아 두고, 바뀌면 멈춘다
      - name: 서버로 올리기
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
          opts=(-o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=30)
          # 공용 서버라 폴더와 환경변수 파일은 본인만 읽게 둔다. scp -p로 runner의 600 권한을 그대로 옮긴다
          sshpass -e ssh "${opts[@]}" -p "$SSH_PORT" "$SSH_ID@$SSH_ADDRESS" \
            'mkdir -p ~/safe-route && chmod 700 ~/safe-route'
          sshpass -e scp -p "${opts[@]}" -P "$SSH_PORT" \
            "$RUNNER_TEMP/image.tar.gz" "$RUNNER_TEMP/app.env" deploy/deploy.sh \
            "$SSH_ID@$SSH_ADDRESS:safe-route/"

      # 서버에서 deploy.sh를 실행한다. 앱 두 대를 한 대씩 바꾸고, 다 되면 "배포 완료"를 찍는다.
      # 실패하면 deploy.sh가 원인 로그를 찍고 0이 아닌 값으로 끝나서 이 단계가 빨갛게 된다
      - name: 서버에서 띄우기
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -p "$SSH_PORT" "$SSH_ID@$SSH_ADDRESS" \
            "bash ~/safe-route/deploy.sh '$APP_PORT'"
